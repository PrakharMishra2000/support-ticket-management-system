spring.application.name=stms

# In-memory development database. Data survives connection closure but not JVM shutdown.
spring.datasource.url=jdbc:h2:mem:ticketdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.time-zone=UTC
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

stms.cors.allowed-origin=${STMS_CORS_ALLOWED_ORIGIN:http://localhost:3000}
# Temporary identity for server-rendered forms until session authentication is implemented.
stms.views.actor-id=${STMS_VIEW_ACTOR_ID:1}
